name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            homebridge-version: 1
          - node-version: 22
            homebridge-version: 1
          - node-version: 22
            homebridge-version: 2.5.0
          - node-version: 24
            homebridge-version: 1
          - node-version: 24
            homebridge-version: 2.5.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false homebridge@${{ matrix.homebridge-version }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
